<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wedding Admin Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="section" style="min-height:100vh">
  <div class="heading">
    <p class="eyebrow">Private couple dashboard</p>
    <h2>Guest Gallery</h2>
    <p>Sign in to manage guests, RSVPs, and uploaded photos.</p>
  </div>

  <div id="adminLogin" class="card" style="max-width:520px;margin:0 auto 20px">
    <h3 style="font-family:'Cormorant Garamond',serif;font-size:32px;margin-top:0">Couple sign in</h3>
    <label style="display:block;margin-bottom:12px">Email
      <input id="adminEmail" type="email" autocomplete="username" style="display:block;width:100%">
    </label>
    <label style="display:block;margin-bottom:12px">Password
      <input id="adminPassword" type="password" autocomplete="current-password" style="display:block;width:100%">
    </label>
    <button id="adminSignIn" class="btn primary">Sign in</button>
    <p id="adminAuthStatus" class="status" role="status"></p>
  </div>

  <div id="adminWorkspace" hidden>
  <button id="adminSignOut" class="btn secondary" style="margin:0 0 16px">Sign out</button>
  <div class="card" style="margin-bottom:20px">
    <h3 style="font-family:'Cormorant Garamond',serif;font-size:32px;margin-top:0">Guest invitations</h3>
    <div class="admin-guest-grid">
      <input id="guestInput" placeholder="Guest name">
      <input id="reservationInput" placeholder="Reservation no. e.g. R-017">
      <input id="tableInput" type="number" min="1" max="3" placeholder="Table 1-3">
      <input id="seatInput" type="number" min="1" max="13" placeholder="Seat for table">
      <button id="addGuestBtn" class="btn primary">Add Guest</button>
    </div>
    <p class="privacy-note">Table capacities: Table 1 · 13 seats, Table 2 · 24 seats, Table 3 · 13 seats.</p>
    <p id="adminStatus" class="status"></p>
    <div id="guestList"></div>
  </div>

  <div id="allPhotos" class="photo-grid"><p class="empty">No guest photos yet.</p></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
